<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>import fixture</title>
<style>
  /* Stand-ins for the Chatwoot color variables the box reads (_next-colors.scss, light). */
  :root{--border-weak:228 228 231;--border-strong:212 212 216;--slate-2:250 250 250;--slate-11:100 100 110;--slate-12:28 28 32;--teal-11:15 118 110;--blue-9:39 129 246;--solid-1:255 255 255;--ruby-3:254 235 236;--ruby-11:196 30 58}
  body{margin:0;padding:2rem 1rem;background:#f4f4f5;font:14px/1.5 system-ui,sans-serif;color:rgb(var(--slate-12))}
  form{max-width:40rem;margin:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;background:#fff;border-radius:1rem}
  select,input[type=text]{width:100%;border:0;border-radius:.5rem;padding:0 .625rem;background:#f4f4f5}
  .cwi-cb svg{display:none} /* Chatwoot's Tailwind draws this tick; the fixture keeps the native checkbox */
  .zone{border:1px dashed rgb(var(--border-strong));border-radius:.75rem;padding:1rem}
  .row:empty{display:none}
</style></head>
<body>
  <!-- A stand-in for Chatwoot's Settings › Data › New import dialog (NewImportDialog.vue). Serve the
       repo root over http, run `npm run build`, open /modules/smart-import/test-fixture/ and pick
       sample.csv (Hebrew) or any CSV/Excel file. Add ?en for the English, left-to-right dialog. -->
  <div id="app">
    <form id="dialog">
      <h3 id="title"></h3>
      <label><input type="radio" name="import-source" value="csv" checked> <span id="source"></span></label>
      <div class="zone"><input id="contact-csv-file" type="file" accept=".csv"><div class="row"></div></div>
      <section>CSV preview (hidden while the box is open)</section>
      <button type="submit" id="import"></button>
    </form>
  </div>
  <script src="./mock-api.js"></script>
  <script src="../dist/import-tool.js"></script>
  <script>window.__CW_ADDONS_BASE = '/modules/sequences/webapp/dist';</script>
  <script src="../inject/import-button.js"></script>
  <script>
    var en = /[?&]en\b/.test(location.search);
    document.getElementById('app').setAttribute('dir', en ? 'ltr' : 'rtl');
    document.getElementById('title').textContent = en ? 'New import' : 'ייבוא חדש';
    document.getElementById('source').textContent = en ? 'CSV or Excel file' : 'קובץ CSV או Excel';
    document.getElementById('import').textContent = en ? 'Import' : 'ייבוא';
    // Chatwoot's side: the zone shows the file it holds, and Import uploads it.
    var input = document.getElementById('contact-csv-file');
    input.addEventListener('change', function () {
      var f = input.files[0];
      var row = input.nextElementSibling;
      row.innerHTML = f ? '<span class="truncate"></span> · <span></span>' : '';
      if (f) { row.firstChild.textContent = f.name; row.lastChild.textContent = f.size + ' Bytes'; }
    });
    document.getElementById('dialog').addEventListener('submit', function (e) {
      e.preventDefault();
      console.log('Chatwoot uploads', input.files[0] && input.files[0].name, 'armed:', window.__store.armed);
    });
    // The box reads the account from the dashboard path; every script above is already loaded.
    history.replaceState(null, '', '/app/accounts/1/settings/data' + location.search);
  </script>
</body></html>
